<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>To Queen Nour,</title>
<meta name="theme-color" content="#2a0710" />
<meta name="description" content="A little surprise for you ❤" />
<meta property="og:title" content="To Queen Nour," />
<meta property="og:description" content="A little surprise for you ❤" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --red: #c1121f;
    --red-dark: #8f0d17;
    --red-deep: #6b0a12;
    --red-light: #e63946;
    --gold: #f3c969;
    --gold-dark: #c9972f;
    --paper: #fff8ec;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #14030a; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(ellipse at 50% 30%, #4a0d18 0%, #2a0710 55%, #14030a 100%);
    -webkit-tap-highlight-color: transparent;
  }

  /* soft glow behind everything */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 80%, rgba(230, 57, 70, .18), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(243, 201, 105, .12), transparent 40%);
    pointer-events: none;
  }

  /* ---------- floating hearts (background) ---------- */
  #hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .heart {
    position: absolute;
    bottom: -40px;
    opacity: 0;
    color: var(--red-light);
    animation: floatUp linear forwards;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(.8); opacity: 0; }
    10%  { opacity: .55; }
    90%  { opacity: .35; }
    100% { transform: translate3d(var(--drift, 30px), -110vh, 0) rotate(var(--rot, 25deg)) scale(1.1); opacity: 0; }
  }

  /* ---------- main stage ---------- */
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    gap: 4px;
  }

  .crown {
    width: 54px;
    height: 40px;
    filter: drop-shadow(0 0 12px rgba(243, 201, 105, .6));
    animation: crownFloat 3.2s ease-in-out infinite;
  }
  @keyframes crownFloat {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-5px) rotate(3deg); }
  }

  h1 {
    font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery",
                 "Lucida Handwriting", "URW Chancery L", cursive, Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.3rem, 8vw, 4.2rem);
    line-height: 1.2;
    text-align: center;
    background: linear-gradient(180deg, #fff3cf 0%, var(--gold) 55%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 14px rgba(243, 201, 105, .35));
    padding: 0 .2em .1em;
  }

  /* ---------- arrow ---------- */
  .arrow {
    width: 84px;
    height: 110px;
    margin: 2px 0 14px;
    overflow: visible;
    animation: bob 1.5s ease-in-out infinite;
    transition: opacity .5s ease;
  }
  .arrow path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 4.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(243, 201, 105, .6));
  }
  .arrow .shaft {
    stroke-dasharray: 140;
    stroke-dashoffset: 140;
    animation: draw 1.2s .4s ease-out forwards;
  }
  .arrow .head {
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw .5s 1.4s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(10px); }
  }
  body.opened .arrow { opacity: .25; }

  /* ---------- envelope ---------- */
  .envelope-wrap {
    perspective: 1100px;
    padding: 70px 20px 10px; /* room for letter + flap when open */
    margin-top: -60px;
  }

  .envelope {
    --w: min(340px, 80vw);
    position: relative;
    width: var(--w);
    height: calc(var(--w) * 0.68);
    cursor: pointer;
    outline: none;
    transform-style: preserve-3d;
    transition: transform .35s ease, filter .35s ease;
    filter: drop-shadow(0 22px 28px rgba(0, 0, 0, .55));
    animation: pulseGlow 2.4s ease-in-out infinite;
  }
  .envelope:hover { transform: translateY(-6px) scale(1.02); }
  .envelope:active { transform: translateY(-2px) scale(.99); }
  .envelope:focus-visible { outline: 3px solid var(--gold); outline-offset: 10px; border-radius: 10px; }

  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 22px 28px rgba(0,0,0,.55)) drop-shadow(0 0 0 rgba(230,57,70,0)); }
    50%      { filter: drop-shadow(0 22px 28px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(230,57,70,.65)); }
  }
  .envelope.open { animation: none; }

  /* inside of envelope */
  .env-back {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: linear-gradient(160deg, var(--red-dark), var(--red-deep));
    z-index: 0;
  }

  /* letter that slides out */
  .letter {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 7%;
    height: 88%;
    background: linear-gradient(180deg, #fffdf6, var(--paper));
    border-radius: 6px;
    z-index: 2;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    align-items: center;
    box-shadow: 0 -2px 10px rgba(0,0,0,.2);
    transition: transform .8s cubic-bezier(.3, 1.2, .5, 1) .35s;
  }
  .letter i {
    display: block;
    height: 4px;
    width: 100%;
    border-radius: 3px;
    background: #e9d9bd;
  }
  .letter i:nth-child(2) { width: 85%; }
  .letter i:nth-child(3) { width: 92%; }
  .letter i:nth-child(4) { width: 60%; }
  .letter b {
    font-size: 22px;
    color: var(--red);
    margin-top: 4px;
    line-height: 1;
  }
  .envelope.open .letter { transform: translateY(-62%); }

  /* front pocket (left / right / bottom triangles) */
  .pocket {
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: 8px;
    pointer-events: none;
  }
  .pocket div { position: absolute; inset: 0; border-radius: 8px; }
  .pocket .l {
    background: linear-gradient(100deg, #b50f1c, #d41f2d);
    clip-path: polygon(0 0, 52% 52%, 0 100%);
  }
  .pocket .r {
    background: linear-gradient(260deg, #b50f1c, #d41f2d);
    clip-path: polygon(100% 0, 48% 52%, 100% 100%);
  }
  .pocket .b {
    background: linear-gradient(0deg, #a30d19, #cc1a29);
    clip-path: polygon(0 100%, 50% 48%, 100% 100%);
  }
  /* subtle fold lines */
  .pocket svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pocket line { stroke: rgba(0,0,0,.22); stroke-width: 1.2; }

  /* flap */
  .flap {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 56%;
    z-index: 4;
    transform-origin: top center;
    transition: transform .6s ease, z-index 0s .3s;
  }
  .flap::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #e0303d, var(--red));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 8px 8px 0 0;
    transition: background .4s ease .25s;
  }
  .envelope.open .flap {
    transform: rotateX(180deg);
    z-index: 1;
  }
  .envelope.open .flap::before {
    background: linear-gradient(0deg, var(--red-dark), #a50f1b);
  }

  /* wax seal */
  .seal {
    position: absolute;
    left: 50%;
    top: 56%;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;
    border-radius: 50%;
    z-index: 5;
    display: grid;
    place-items: center;
    font-size: 24px;
    color: #7a0a13;
    background: radial-gradient(circle at 35% 30%, #ffe8a6, var(--gold) 45%, var(--gold-dark));
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.2);
    transition: opacity .3s ease, transform .4s ease;
  }
  .envelope.open .seal { opacity: 0; transform: scale(.4) rotate(40deg); }

  /* ---------- message modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(12, 2, 6, .72);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease, visibility 0s .5s;
  }
  .overlay.show {
    opacity: 1;
    visibility: visible;
    transition: opacity .5s ease;
  }

  .card {
    position: relative;
    width: min(620px, 100%);
    max-height: 92vh;
    max-height: 92dvh;
    overflow-y: auto;
    padding: clamp(28px, 6vw, 48px) clamp(22px, 5vw, 44px);
    border-radius: 18px;
    color: #4a0d18;
    text-align: center;
    background:
      radial-gradient(circle at 50% 0%, #fffdf5, var(--paper) 70%);
    border: 3px solid var(--gold);
    outline: 2px solid rgba(201, 151, 47, .45);
    outline-offset: -12px;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(230, 57, 70, .35);
    transform: translateY(60px) scale(.85) rotate(-2deg);
    transition: transform .7s cubic-bezier(.2, 1.1, .3, 1);
  }
  .overlay.show .card { transform: none; }

  .card .ornament {
    font-size: 1.6rem;
    color: var(--red);
    letter-spacing: .5em;
    padding-left: .5em;
    animation: beat 1.6s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  .message {
    direction: rtl;
    unicode-bidi: isolate;
    text-align: right;
    font-family: "Noto Naskh Arabic", "Amiri", "Scheherazade New", "Traditional Arabic",
                 "Geeza Pro", "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: clamp(1.35rem, 4.6vw, 1.95rem);
    line-height: 2.1;
    font-weight: 600;
    margin: 14px 0 12px;
    color: #5a0f1b;
  }
  .message .w {
    display: inline-block;
    opacity: 0;
    transform: translateY(10px);
    filter: blur(4px);
    animation: wordIn .7s ease forwards;
  }
  @keyframes wordIn {
    to { opacity: 1; transform: none; filter: none; }
  }

  .close {
    position: absolute;
    top: 12px;
    left: 12px;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: #fff;
    background: var(--red);
    z-index: 5;
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
    transition: transform .2s ease, background .2s ease;
  }
  .close:hover { background: var(--red-light); transform: rotate(90deg) scale(1.08); }
  .close:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* heart burst particles */
  .burst {
    position: fixed;
    z-index: 15;
    pointer-events: none;
    font-size: 20px;
    animation: burst 1.4s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: translate(0, 0) scale(.3); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--r)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .arrow .shaft, .arrow .head { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<div id="hearts" aria-hidden="true"></div>

<main class="stage">
  <!-- little crown -->
  <svg class="crown" viewBox="0 0 64 48" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff0bf"/>
        <stop offset=".6" stop-color="#f3c969"/>
        <stop offset="1" stop-color="#c9972f"/>
      </linearGradient>
    </defs>
    <path d="M4 14 L18 26 L32 6 L46 26 L60 14 L54 42 H10 Z" fill="url(#g)" stroke="#a87a1f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="4"  cy="13" r="4" fill="#fff0bf" stroke="#a87a1f" stroke-width="1.5"/>
    <circle cx="32" cy="5"  r="4.5" fill="#e63946" stroke="#a87a1f" stroke-width="1.5"/>
    <circle cx="60" cy="13" r="4" fill="#fff0bf" stroke="#a87a1f" stroke-width="1.5"/>
    <rect x="10" y="36" width="44" height="6" fill="#c9972f" opacity=".55"/>
  </svg>

  <h1>To Queen Nour,</h1>

  <!-- arrow pointing toward the envelope -->
  <svg class="arrow" viewBox="0 0 80 110" aria-hidden="true">
    <path class="shaft" d="M40 4 C66 28, 14 52, 38 98"/>
    <path class="head"  d="M23 82 L38 98 L55 84"/>
  </svg>

  <div class="envelope-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0"
         aria-label="Open the red envelope" aria-expanded="false">
      <div class="env-back"></div>

      <div class="letter" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
        <b>♥</b>
      </div>

      <div class="pocket" aria-hidden="true">
        <div class="l"></div>
        <div class="r"></div>
        <div class="b"></div>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="0" y1="0" x2="52" y2="52" vector-effect="non-scaling-stroke"/>
          <line x1="100" y1="0" x2="48" y2="52" vector-effect="non-scaling-stroke"/>
          <line x1="0" y1="100" x2="50" y2="48" vector-effect="non-scaling-stroke"/>
          <line x1="100" y1="100" x2="50" y2="48" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <div class="flap" aria-hidden="true"></div>
      <div class="seal" aria-hidden="true">♥</div>
    </div>
  </div>
</main>

<!-- the message -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Message for Nour">
  <div class="card" id="card" dir="rtl">
    <button class="close" id="close" aria-label="Close message">✕</button>
    <div class="ornament" aria-hidden="true">♥ ♥ ♥</div>
    <p class="message" id="message" lang="ar" dir="rtl"></p>
    <div class="ornament" aria-hidden="true">♥ ♥ ♥</div>
  </div>
</div>

<script>
(function () {
  var MESSAGE = "بحبك يا احلي واجمل نور في حياتي ربنا يخليكي ليا يا نور عيني وحياتي كلها وميحرمنيش منك ابدا واكون في ضهرك ومعاكي طول عمري بحبك يا احلي نور في الدنيا كلها يا احلي نور شافتها عيني";

  var envelope = document.getElementById('envelope');
  var overlay  = document.getElementById('overlay');
  var closeBtn = document.getElementById('close');
  var msgEl    = document.getElementById('message');
  var hearts   = document.getElementById('hearts');
  var timers = [];

  /* ---------- background floating hearts ---------- */
  var glyphs = ['♥', '♡', '❤'];
  function spawnHeart() {
    if (document.hidden) return;
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    var size = 12 + Math.random() * 26;
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = size + 'px';
    h.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
    h.style.setProperty('--rot', (Math.random() * 70 - 35) + 'deg');
    var dur = 7 + Math.random() * 8;
    h.style.animationDuration = dur + 's';
    hearts.appendChild(h);
    setTimeout(function () { h.remove(); }, dur * 1000 + 200);
  }
  for (var i = 0; i < 8; i++) setTimeout(spawnHeart, i * 350);
  setInterval(spawnHeart, 900);

  /* ---------- message words (animated in one by one) ---------- */
  function buildMessage() {
    msgEl.textContent = '';
    var words = MESSAGE.split(' ');
    words.forEach(function (word, idx) {
      var span = document.createElement('span');
      span.className = 'w';
      span.textContent = word;
      span.style.animationDelay = (0.5 + idx * 0.1) + 's';
      msgEl.appendChild(span);
      if (idx < words.length - 1) msgEl.appendChild(document.createTextNode(' '));
    });
  }

  /* ---------- heart burst when envelope opens ---------- */
  function burst() {
    var r = envelope.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 18; i++) {
      var p = document.createElement('span');
      p.className = 'burst';
      p.textContent = Math.random() > .3 ? '❤' : '✨';
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      p.style.color = Math.random() > .5 ? '#ff4d5e' : '#f3c969';
      var a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
      p.style.setProperty('--dx', Math.cos(a) * d + 'px');
      p.style.setProperty('--dy', Math.sin(a) * d - 60 + 'px');
      p.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
      document.body.appendChild(p);
      setTimeout(function (el) { el.remove(); }.bind(null, p), 1500);
    }
  }

  var state = 'closed'; // closed -> opening -> shown -> closing -> closed

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function openEnvelope() {
    if (state !== 'closed') return;          // ignore extra clicks while animating
    state = 'opening';
    envelope.classList.add('open');
    envelope.setAttribute('aria-expanded', 'true');
    document.body.classList.add('opened');
    burst();
    timers.push(setTimeout(function () {
      buildMessage();
      overlay.classList.add('show');
      state = 'shown';
      closeBtn.focus({ preventScroll: true });
    }, 1150));
  }

  function closeEnvelope() {
    if (state !== 'shown') return;
    clearTimers();
    state = 'closing';
    overlay.classList.remove('show');
    timers.push(setTimeout(function () {
      envelope.classList.remove('open');
      envelope.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('opened');
      state = 'closed';
      envelope.focus({ preventScroll: true });
    }, 450));
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
  });
  closeBtn.addEventListener('click', closeEnvelope);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeEnvelope(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeEnvelope();
  });
})();
</script>
</body>
</html>
